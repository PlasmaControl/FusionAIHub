# The phenomenon registry: what counts as EVIDENCE for each of plan §5.6's round-1 phenomena.
#
# The ids and the alias lists are NOT here. `src/labeler/events/lexicons.yaml` is the single
# source of both (plan §5.6, and that file's own header says so); `shot_design.retrieval.phenomena`
# reads it and merges the aliases onto these entries. An `aliases:` or `exclude:` key in this file
# is a `PhenomenaError`, not a second opinion -- a test pins that.
#
# What lives here is the scoring machinery around each id:
#
#   title            display name (kept equal to the lexicon's; the lexicon's is the matcher's)
#   labels           labels_wide rows that are EVIDENCE OF THE PHENOMENON, per (slug, label).
#                    `thr` is that label's operating point AND the floor its `max_valid` has to
#                    clear to count as evidence. `thr: null` -- every entry today, because
#                    `labels_wide.thr` is NaN for every row of both detection labels -- falls
#                    back to `retrieval.yaml`'s `phenomenon.label_floor` (0.5). Below the floor
#                    the probability is still REPORTED, with a caveat naming it, and does not
#                    lift the shot into the label tier: "the model ran" is not evidence, and a
#                    quarter of this database's scored tearing shots are at or under 0.010.
#                    `weight` scales that number inside one phenomenon. A series `labels.yaml`
#                    declares to be a forecast may not be listed here at all -- it is a claim
#                    about the future and reaches a hit through `forecasts:`.
#                    Only slugs/labels that EXIST in the built labels_wide (16,800 rows over five
#                    model slugs) or are named in `labels.yaml` are listed. Fourteen of the sixteen
#                    phenomena have no label model at all: that is a gap in the label corpus, and
#                    an empty list is how it is stated.
#   events           which labeler event rows count as OBSERVED evidence. `source` is the
#                    detector; `phenomenon` is the string THAT DETECTOR writes, which is not
#                    shot_design's id -- `tokeye_track` writes "coherent_mode" for every track and
#                    "pickup" for a receiver line, `elm_clock` writes "elm"/"elm_free", `dalpha_lh`
#                    writes "lh_transition"/"hl_transition". `band_khz` is matched against the
#                    track's `attrs.f_centroid_khz` (the probability-weighted centre; `f0/f1_khz`
#                    is the track's full extent and spans 0.5-248 kHz on a real row, so it
#                    separates nothing). `attrs` adds descriptor predicates:
#                    `min_harmonics` -> `attrs.n_harmonics >= n`, `chirp_sign: -1` ->
#                    `attrs.chirp_khz_per_ms < 0`, `pickup: true` -> `attrs.pickup is true`.
#                    `max_bandwidth_khz` bounds `attrs.bandwidth_khz` (the f0-f1 extent when a
#                    source records no bandwidth; a row that records NEITHER is not rejected for
#                    it). The centroid alone puts a track spanning 0.5-248 kHz in whatever band
#                    its middle lands in: measured on the three real labeler shots, 5-12 % of
#                    the rows the tearing rule matched are wider than the whole tearing band.
#                    The rule of thumb here is that a track must FIT INSIDE the band it is
#                    claimed to be in, so the bound is the band's own width (and a declared cap
#                    where the band is open-topped).
#                    `weight` is what one matching row is worth in the event term (default 1.0,
#                    the value for a detector that detects the class it is registered under).
#                    `caveat` names a constant in `shot_design.retrieval.phenomena` that every hit
#                    built on the rule carries. The two exist for the same case: a detector
#                    whose output is not a classification of THIS phenomenon.
#   forecasts        event SOURCES whose rows for this phenomenon are forecasts. A forecast is
#                    never an observation (plan §2, §7, Appendix C item 7): these rows land in
#                    `PhenomenonHit.forecasts`, in their own field, and rank below any observation.
#   coverage_sources extra sources whose rows prove someone LOOKED, beyond the detectors above.
#                    `elm_clock` records D-alpha coverage even when it finds no peaks;
#                    its `elm_free` intervals supply legacy row-based coverage too.
#                    Only filterscopes rows count; older magnetics clocks do not.
#                    Without coverage every quiet shot would look like "nobody looked" and `--avoid
#                    phenomenon:elm` could never establish a real negative. A phenomenon with no
#                    detector at all (`rwm`, `detachment`) declares none, so its coverage stays
#                    unknown -- which is the honest answer.
#   band_khz         where the mode lives, for display and for a frequency caveat. Physics, not a
#                    filter: `events.band_khz` is what actually selects rows.
#   diags            the `diag` strings labeler writes on this phenomenon's own rows.
#                    Documentation only; these do not filter coverage or events.
#   coverage_diags   optional list of allowed diagnostics for COVERING sources (event detectors
#                    plus `coverage_sources`). When non-empty, both source coverage rows and
#                    event rows must name one of these diagnostics to count for this phenomenon.
#                    Other diagnostics are legacy rows and establish neither coverage nor hits.
#                    Omitted or empty means no diagnostic restriction; other sources are unaffected.
#   requires_group   corpus groups a shot needs before its silence is informative. False
#                    has_* flags produce a caveat when the corpus was inventoried. Legacy
#                    all-false defaults without an inventory remain unknown; recorded detector
#                    evidence is retained even when the inventory disagrees.
#   prior            the fraction of the 500 `recommender_v1` shots whose OWN logbook carries a
#                    positive, observed mention (`text_claims`, scope=shot). Measured, not
#                    assumed, and metadata only: no term of the score reads it. 0.000 for qcm and
#                    pickup means the operators never write them down -- the detectors are the
#                    only route to those two.
#   database         a curated shot list, when one exists, named ONE of two ways: `path_key`, a
#                    key of paths.yaml rather than an absolute path, or `tables`, the manifest
#                    stems of `data/events/tables.yaml` resolved through labeler's own
#                    reader. Either way it is MEMBERSHIP and not observation: a hit ranks in
#                    the DATABASE class, below a forecast, and its coverage stays unknown.
#
# The seventeen registered ids, in the lexicon's order: the round-1 twelve, `transient`, the
# three `qmin_*` rule ids and -- last, because it is a topic and not one of them -- `fast_ion`.
version: 1
phenomena:
  ae:
    title: Alfven eigenmode
    labels:
      - {slug: d3d_ae_activity_seldnet, label: ae_active, thr: null, weight: 1.0}
    events:
      # A track at or above 40 kHz. TAE/RSAE sit well above the EHO band and below the
      # ~250 kHz top of the wide pass; the AE label above is the other half of the claim.
      - {source: tokeye_track, phenomenon: coherent_mode, band_khz: [40.0, null],
         max_bandwidth_khz: 100.0}
    forecasts: []
    band_khz: [40.0, 250.0]
    diags: [mhr, ece, co2]
    requires_group: [mhr, ece]
    prior: 0.006

  eho:
    title: Edge harmonic oscillation
    labels: []
    events:
      # The EHO is a low-frequency mode with a harmonic comb: 2-20 kHz AND >= 2 harmonics.
      # Without the harmonic count this band is also where every slow drift and the co2 pickup
      # line at 1.7-2.3 kHz sits.
      - {source: tokeye_track, phenomenon: coherent_mode, band_khz: [2.0, 20.0],
         max_bandwidth_khz: 18.0, attrs: {min_harmonics: 2}}
    forecasts: []
    band_khz: [2.0, 20.0]
    diags: [mhr, ece, co2]   # the passes tokeye_track writes tracks on
    requires_group: [mhr, co2]
    prior: 0.008

  elm:
    title: Edge localised mode
    labels: []          # the DSM risk heads are forecasts
    events:
      - {source: elm_clock, phenomenon: elm}
    forecasts: [label_forecast]
    coverage_sources: [elm_clock]
    coverage_diags: [filterscopes]
    band_khz: null
    diags: [filterscopes]
    requires_group: [filterscopes]
    prior: 0.110

  transient:
    title: Transient activity
    labels: []
    events:
      - {source: tokeye_transient, phenomenon: transient}
    forecasts: []
    band_khz: null
    diags: [mhr, mirnov, ece, co2, bes]
    requires_group: []
    prior: 0.0          # not yet measured; no scoring term reads prior

  tearing:
    title: Tearing mode
    labels:
      - {slug: d3d_tearing_onset_cnn1d, label: tm_prob, thr: null, weight: 1.0}
    events:
      # Low-frequency rotating island; a locked mode is at 0 kHz. 30 kHz is the top of the band
      # the 2/1 and 3/2 are seen rotating in on these shots.
      - {source: tokeye_track, phenomenon: coherent_mode, band_khz: [null, 30.0],
         max_bandwidth_khz: 30.0}
    forecasts: [label_forecast]
    band_khz: [0.0, 30.0]
    diags: [mhr, ece, co2]
    requires_group: [mhr]
    prior: 0.062

  sawtooth:
    title: Sawtooth
    labels: []
    events:
      - {source: ece_sawtooth, phenomenon: sawtooth}
    forecasts: []
    band_khz: null
    diags: [ece]
    requires_group: [ece]
    prior: 0.006

  fishbone:
    title: Fishbone
    labels: []
    events:
      # A fishbone chirps DOWN. `chirp_khz_per_ms` is the least-squares slope of the per-column
      # centroid, so the sign is the whole discriminator; 174 of 454 tracks on shot 198658 are
      # down-chirping, which is why the band matters too.
      - {source: tokeye_track, phenomenon: coherent_mode, band_khz: [5.0, 40.0],
         max_bandwidth_khz: 35.0, attrs: {chirp_sign: -1}}
    forecasts: []
    band_khz: [5.0, 40.0]
    diags: [mhr, ece, co2]
    requires_group: [mhr]
    prior: 0.004

  qcm:
    title: Quasi-coherent mode
    labels: []
    events:
      - {source: tokeye_track, phenomenon: coherent_mode, band_khz: [40.0, 120.0],
         max_bandwidth_khz: 80.0}
    forecasts: []
    band_khz: [40.0, 120.0]
    diags: [mhr, ece, co2]
    requires_group: [mhr, co2]
    prior: 0.000

  qh:
    title: Quiescent H-mode
    labels: []
    events:
      - {source: qh_proxy, phenomenon: qh}
    forecasts: []
    band_khz: null
    diags: []      # qh_proxy writes no diag: it is derived from tracks and elm_free
    requires_group: [mhr]
    prior: 0.018
    database:
      name: QH_Database
      path_key: qh_database_csv    # paths.yaml -> .../0labeled_data/QH_Database.csv
      note: >-
        134 rows, 107 distinct shots, all between 173694 and 175544 -- and 0 of the 107 are in
        the 500-shot recommender_v1 database, so this term contributes nothing today. It is
        wired because the list is the only human-curated QH evidence there is, and a database
        built over the 2016-2017 campaigns would light it up.

  lh:
    title: L-H transition
    labels: []
    events:
      # `lh_transition` only. `hl_transition` is the way back out and is a different claim.
      - {source: dalpha_lh, phenomenon: lh_transition}
    forecasts: []
    band_khz: null
    diags: [filterscopes]
    requires_group: [filterscopes]
    prior: 0.016

  detachment:
    title: Divertor detachment
    labels: []
    events: []          # no detector writes detachment; text is the only route (see the caveats)
    forecasts: []
    band_khz: null
    diags: []
    requires_group: []
    prior: 0.022

  pickup:
    title: Instrumental pickup
    labels: []
    events:
      # A descriptor, not a plasma phenomenon: a row lit for most of the record is a receiver
      # line. Kept in the registry so "which shots does the ece pickup move on" is answerable.
      - {source: tokeye_track, phenomenon: pickup, attrs: {pickup: true}}
    forecasts: []
    band_khz: null
    diags: [mhr, ece, co2]
    requires_group: [mhr]
    prior: 0.000

  rwm:
    title: Resistive wall mode
    labels: []
    # No DETECTOR writes rwm. The two curated tables below do, through
    # `labeler.events.databases`, and their rows carry `evidence_kind: database` with NaN
    # coverage -- so they are never an observation and never donate coverage. Text is the only
    # other route (see the caveats).
    events: []
    forecasts: []
    band_khz: [0.0, 10.0]
    diags: []      # nothing detects rwm, so nothing writes a diag for it
    requires_group: [mhr]
    prior: 0.012
    database:
      name: RWM_Onsets
      # Manifest stems, not a path: `data/events/tables.yaml` says where each CSV is and what
      # its columns mean, and `_table_shots` resolves them through labeler's own reader.
      tables: [rwm_onsets_2017, rwm_onsets_2024]
      note: >-
        Jeremy Hansen's onset databases: 56 rows, 33 distinct shots, 156785-176092 -- and 0 of
        the 33 are in the 500-shot recommender_v1 database or in the corpus (which starts at
        185601), so this term contributes nothing today. It is wired because the tables are the
        only human-curated RWM evidence there is, and a database built over those campaigns
        would light it up. A hit here ranks in the DATABASE class, below a forecast and never as
        an observation.

  # The three q-min regime bands (labeler `events/heuristics.py::qmin_regimes`, task L-D2).
  # Scenario ids, not instability ids: they say what the discharge WAS, and the only producer is
  # a threshold rule on EFIT01's q-min inside the Ip flat-top. Three things follow from that.
  #
  # `qmin_rule` rows carry `confidence = NaN` -- a threshold on a reconstructed scalar has no
  # calibrated probability -- so nothing here may read one as a detector's score.
  #
  # `coverage_sources: [qmin_rule]` is not redundant with `events:`. The rule writes a source row
  # on every shot whose features file carries `qmin` AND whose `ip` gave a flat-top, event or no
  # event, and its coverage is the flat-top met with the finite q-min record. That row is the
  # only thing that can say "this shot ran at q-min under 0.95 throughout" rather than "nobody
  # computed it": a shot in none of the three bands writes no event row at all.
  #
  # `requires_group: []` because the inputs are not corpus groups. `ip` and `qmin` come from the
  # features store (`\efit01::top.results.aeqdsk:qmin` through fdp), which is why these are the
  # first phenomena whose coverage does not depend on what the corpus file holds.
  qmin_hybrid:
    title: Hybrid scenario (q-min 0.95-1.5)
    labels: []
    events:
      - {source: qmin_rule, phenomenon: qmin_hybrid}
    forecasts: []
    coverage_sources: [qmin_rule]
    band_khz: null
    diags: [qmin]
    requires_group: []
    prior: 0.004

  qmin_elevated:
    title: Elevated q-min (1.5-2)
    labels: []
    events:
      - {source: qmin_rule, phenomenon: qmin_elevated}
    forecasts: []
    coverage_sources: [qmin_rule]
    band_khz: null
    diags: [qmin]
    requires_group: []
    prior: 0.000

  qmin_high:
    title: High q-min (above 2)
    labels: []
    events:
      - {source: qmin_rule, phenomenon: qmin_high}
    forecasts: []
    coverage_sources: [qmin_rule]
    band_khz: null
    diags: [qmin]
    requires_group: []
    prior: 0.000

  # A TOPIC, not a mode, and the entry that says so in machine-readable form: no label head, no
  # event rule, no coverage source, no band, no diagnostic, no required group. `locate("fast_ion")`
  # can therefore only ever return TEXT ONLY hits, which is exactly the claim the corpus supports
  # -- somebody wrote "fast ion" in this shot's logbook -- and it can never be mistaken for a
  # detector having seen something.
  #
  # It exists because the I11 evalset asked 16 fast-ion questions and seven of them resolved to
  # nothing, and the tempting fix -- aliasing `fida`, `beam ion`, `fast ion` and `energetic
  # particle` onto `ae` -- would have been much worse than the gap: `ae` has a >= 40 kHz detector
  # band, a label head and an `--avoid phenomenon:ae` path read as "the AE detector looked and saw
  # nothing", so a diagnostic name resolving to it would turn a topic match into a mode
  # observation. See lexicons.yaml's own note.
  #
  # `coverage_sources: []` is stated rather than omitted: nothing looks for fast-ion physics as
  # such, so coverage stays unknown, which is the honest answer (same as `rwm` and `detachment`).
  fast_ion:
    title: Fast-ion physics
    labels: []
    events: []
    forecasts: []
    coverage_sources: []
    band_khz: null
    diags: []
    requires_group: []
    # Measured 2026-09-13 over the 500 recommender_v1 shots, as the fraction whose OWN logbook
    # text (`shots.parquet.text_log`) carries a positive lexicon hit: 2 of 500. The same
    # measurement gives ae 0.004, tearing 0.070, elm 0.110 against the registry's 0.006 / 0.062 /
    # 0.110, so it is the same number to within the `text_claims` temporality filter. Metadata
    # only: no term of the score reads it.
    prior: 0.004
