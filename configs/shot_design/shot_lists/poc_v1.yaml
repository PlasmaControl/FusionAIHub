# How this list was built, and the one judgement call in it.
#
# All sizes below are decimal GB (1e9 bytes), and every one of them was re-measured for this
# regeneration. An earlier version of this header quoted the same cost table in GiB while calling
# it GB, which is a 7 % understatement.
#
# Every shot below needs its raw signals on disk before the database can be built, and what that
# costs depends entirely on which campaign the shot is from. Measured group by group on staged shot
# 161172 (3.037 GB on disk, 2.829 GiB): the four high-rate diagnostics -- BES 1.363, calibrated ECE
# 0.980, high-resolution magnetics 0.151 and the CO2 interferometer 0.297 -- are 2.791 GB of that
# file, and the remaining 0.246 GB is every other group in it, the equilibrium scalars and profiles
# included. So:
#
#   * 2014-2015 staged shots cost nothing. /scratch/gpfs/EKOLEMEN/d3d_fusion_data holds the whole
#     file for 936 of them already, high-rate raws included (median 2.922 GB, mean 2.140 GB, 2.00 TB
#     in total).
#   * 2019-2025 shots inside 185601-204999 cost at most about 0.25 GB each. The high-rate raws are
#     already on disk as /scratch/gpfs/EKOLEMEN/foundation_model/<shot>_processed.h5 (16,909 shots,
#     median 3.350 GB, mean 3.430 GB, 58 TB in total); only the groups those files do not carry
#     still have to be pulled.
#   * 2016-2018 shots cost the full ~3.0 GB each. Neither store holds anything between 165000 and
#     176999, so every channel has to be fetched from scratch.
#
# Two caveats on those per-shot figures, both of which make the headline an upper bound rather
# than an estimate:
#
#   * The 0.25 GB processed-tier cost is charged as if a processed file held only the four
#     high-rate diagnostics. It holds far more than that: 200443_processed.h5 already carries
#     gas_flow, gas_raw, pinj, tinj, ech_power, rmp, i_coil, the Thomson ts_* groups and the
#     cer_* groups, all of which the database needs. What is genuinely missing from it is Ip, the
#     equilibrium magnetics and the EFIT scalars and profiles -- a fraction of the 0.25 GB.
#   * Both non-zero tier costs are extrapolated from a *single* 2015 shot, 161172, because that is
#     the only era where a complete file exists locally to measure. There is no 2016-2018 file
#     anywhere on this filesystem to check the ~3.0 GB against. The two store medians above are the
#     only cross-era evidence there is, and they bracket it (2.922 GB staged, 3.350 GB processed).
#
# That is still a factor of twelve between the tiers, and it is why the breadth allocation below is
# deliberately uneven. The default 24 / 36 / 70 split across 2016-2018 / 2019-2021 / 2022-2025 buys
# 19 % of the breadth shots from the era that costs 74 % of the fetch volume. Zeroing 2016-2018
# out would cut the fetch from roughly 99 GB to 26 GB.
#
# What we would lose by zeroing it out, measured on the candidate pool rather than assumed:
#
#   * Not a single theme. All fourteen curation themes have at least nine distinct runs in the
#     already-processed 2019-2025 pool, so no line of physics disappears from the database.
#   * The era itself. 2016-2018 is a contiguous three-year hole between the staged shots and the
#     processed store, so every retrieval for a 2016-2018 query would have to answer from a
#     different campaign, on a differently configured machine.
#   * The strongest source of fast-ion / Alfven-eigenmode runs: 14 distinct runs in 2016-2018
#     against 9 in the whole processed pool. It is the one theme where the cheap eras are thinner
#     than the expensive one.
#
# So 2016-2018 is kept, but thin and wide: 24 shots spread over 12 runs, one run per theme cell,
# which represents the era across as many distinct experiments as the budget allows. What it gives
# up is depth inside any one 2016-2018 experiment, not the era.
#
# Reading the rows below, six things are worth knowing:
#
#   * `targets.breadth_by_era` and the per-shot `era` strata do not agree, on purpose. The budget
#     is spent per *run*, and a run is assigned to the campaign holding most of its shots, but each
#     shot carries its own era. Three runs straddle a boundary; run 20220620 (metadata shot_range
#     "189985 - 190020", logbook records 189987-190018) is the one that shows here, so the
#     2019_2021 / 2022_2025 budget of 36 / 70 lands as 38 / 68 shots.
#   * **Which shots inside a run were picked is close to arbitrary.** The differentiators the
#     allocator uses -- mini-proposal step and the requested Ip/PNBI bins -- are mostly absent from
#     the logbook: `mp_step` is filled in for 17.2 % of the eligible staged rows and the requested
#     bins for 9.0 %, and only 9 of the 34 staged runs (61 of the 99 runs in this list) have two
#     distinct keys to tell their shots apart at all. Where they do not, the tie-break is shot
#     order. Over these 200 shots: 72 are their run's first eligible shot, 143 are in the first
#     three, 185 are in the first half, and the median rank is 2 inside runs that average 19.6
#     eligible shots. The largest run in this list, 20170418, has 41 eligible shots and
#     contributes its 1st and its 9th -- the setup shots, not the scan the mini-proposal
#     describes. If you care about a particular run, name later shots of it under
#     `hand_review: add:` -- that is what the block is for.
#   * The 2019-2021 shots can only come from 185601-189999, because that is where the processed
#     store starts. They are the late part of that campaign, not a sample across it. Drawing from
#     the earlier part of 2019-2021 costs the full ~3.0 GB per shot, exactly like 2016-2018.
#   * Two shots are taken from each run wherever the run has two, because the mini-proposal ->
#     shots evaluation cannot score a mini-proposal that has only one shot in the database.
#   * `evidence:` on a failed shot is one log entry, copied word for word from what that operator
#     wrote (whitespace collapsed, cut at 200 characters around the fault it names, with an
#     ellipsis on whichever side was cut). It is there so the verdict can be checked rather than
#     trusted -- if it does not read like a failed shot, drop the shot in `hand_review`.
#   * Failed shots (operator verdict bad or mixed) are held near 12 % on purpose. They are what
#     lets the recommender warn about a setting, but 18 % of the 586 eligible staged shots and
#     22 % of the 17,258 eligible breadth shots are bad or mixed, so taking one from every run would
#     put the list past a third failed.

