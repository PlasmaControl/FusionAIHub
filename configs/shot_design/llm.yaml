version: 2
# The local language model behind the design chat, the offline shot blurbs and describe.polish.
# On Frontier the only model is Gemini Flash via the Antigravity CLI (agy); the client
# (shot_design.llm.client) renders the chat as an agy prompt with a JSON schema and
# emulates tool calls from the structured output (shot_design.llm.agy). The Stellar
# Ollama path (Gemma over an OpenAI-compatible endpoint) still works for one release
# via the `ollama:` block below; a hosted OpenAI-compatible provider is a base_url and
# a key in the environment (LLM_API_KEY), never a code change.
provider: agy   # "ollama" for the Stellar endpoint; "off" disables all calls
agy:
  bin: agy
  timeout_s: 300
  retries: 2               # timeouts, empty exits, empty SUCCESS replies and 429 quota errors
  backoff_s: 20            # first wait after a 429; doubles per retry (20 s, 40 s)
  extra_args: ["--disable-slash-commands"]
# Claude through Claude Code's own CLI (house rule: agy is Gemini-only, Claude never goes
# through agy, GPT only through Codex). Available, not the fallback: when agy is out of
# quota on Stellar the pipeline falls back to Gemma via Ollama (`--provider ollama`).
# extra_args strip the CLI's context to the bare model call (no tools/MCP/project
# settings, no session file): ~13 k cached system tokens per call instead of ~54 k.
claude:
  bin: claude
  timeout_s: 300
  retries: 2
  backoff_s: 20
  extra_args: ["--tools", "none", "--strict-mcp-config", "--setting-sources", "user", "--no-session-persistence"]
models:                    # replaces the gemma4 entries; `agy models` lists the ids
  quality: gemini-3.8-flash-high
  fast: gemini-3.8-flash-low
default: quality
timeout_s: 120                   # per model call (ollama path)
max_tool_rounds: 8               # per chat turn
temperature: 0.0
max_tokens: 600
cache: true                      # deterministic (temperature 0) requests are cached under llm_cache_dir
blurb:
  model: fast
  max_words: 90
  prompt_version: 6              # part of the prompt: bump to invalidate every cached blurb
                                  # v2: states the word cap explicitly and targets 40-60 words,
                                  # so a reply naturally lands under gate's max_words cutoff
                                  # v3: owner decision -- exactly two sentences, no quotation
                                  # marks at all; the gate no longer checks quotes (removed)
                                  # v4: reviewer found a bad ending ("performing as expected")
                                  # dressed up a fast current quench; gate now rejects quotation
                                  # marks and the prompt requires naming a disruption/quench/
                                  # early termination plainly in the second sentence
                                  # v5: exactly three sentences: goal; success/failure; one
                                  # finding or "No notable findings were logged." The gate
                                  # enforces three complete sentences; word cap is 90.
                                  # v6: abbreviations verbatim, never expanded; numbers never as
                                  # words; gate adds number-word and unknown-acronym rules. Audit
                                  # of the 2026-09-15 v5 backfill found AE->aeroelastic,
                                  # EHO->edge helical, QH->quasi-high, FPP->flat pressure profile,
                                  # PCS->power control system, betan->poloidal beta, V.s->volts,
                                  # and spelled-out numerals.
# Stellar only; kept readable for one release. None of this exists on Frontier.
ollama:
  models:                   # tags served by serve_llm.sh; override the top-level gemini ids
    quality: gemma4:26b     # whenever provider is ollama (`--provider ollama`, or here)
    fast: gemma4:e4b
  # gemma4:26b is a reasoning model: through /v1/chat/completions it spends the whole
  # max_tokens budget on a `reasoning` field and returns content "" (re-measured
  # 2026-09-21: 1,500 generated tokens, empty content, the assistant's propose stage
  # fails). "none" turns that off; the key travels only with provider ollama.
  reasoning_effort: "none"
  base_url: null            # e.g. http://127.0.0.1:11434, bypasses the endpoint file
  endpoint_file: llm/endpoint.json  # paths.data_root-relative; serve_llm.sh writes it
  ollama_bin_dir: null            # not installed on Frontier; Stellar-only
  ollama_models_dir: null         # not installed on Frontier; Stellar-only
  ollama_home_dir: null           # not installed on Frontier; Stellar-only
