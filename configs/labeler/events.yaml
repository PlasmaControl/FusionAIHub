# The label tables' manifest: the interval schema, the label grid, the review
# taxonomy, and the format and raw datasets. Source, so it is tracked here; the
# tables themselves live under the label-tables root (`data/events/` by default,
# `LABELER_LABEL_TABLES` otherwise), which git ignores. Every category name and
# every `raw_datasets` path below is relative to that root. Read through
# `labeler.config.Paths.events_manifest` (`LABELER_CONFIG_DIR` overrides the
# directory). Docs: docs/labeler/events/README.md.
version: 1

interval_schema:
  version: 1
  columns:
    - shot
    - category
    - t_start
    - t_end
    - confidence
  time_units: ms

label_grid:
  formatted_shots: "format/shots/<shot>.npz"
  extended_shots: "extend_<producer>/<shot-list>/<shot>.npz"
  version: 1
  sample_interval_ms: 50
  axis_order: [time, rho]
  time_units: ms
  rho_bins: 20
  rho_range: [0.0, 1.0]
  classes:
    default:
      0: absent
      1: present
    minimum_safety_factor:
      0: absent
      1: low
      2: hybrid
      3: elevated
      4: high
    detachment:
      0: absent
      1: attached
      2: detached
      3: marfe
      4: uncertain
    # The event catalog's six phenomena: in their tables the category is the state.
    alfven_eigenmode: &catalog_states
      0: absent
      1: present
      2: uncertain
      3: not_observable
    neoclassical_tearing_mode: *catalog_states
    high_confinement_mode: *catalog_states
    edge_localized_mode: *catalog_states
    sawtooth_oscillation: *catalog_states
    disruption: *catalog_states

# Directories here that are not event categories; category scans skip them.
non_category_dirs:
  - catalog
  # Shared raw confinement sources (their reconciliation notebook is
  # examples/labeler/confinement/); also the review page's `confinement` event
  # (its roster and source pointer).
  - confinement
  # The silver set: 450 shots reviewed for every event
  # (docs/labeler/events/silver/README.md); the gold set (50 hand-labeled shots,
  # docs/labeler/events/gold/README.md) is a list, not a category.
  - silver
  - gold

# What the review page calls each event, how its dropdown groups them, and the
# subcategories nested under one (read by `labeler.events.taxonomy`). A
# subcategory is labelled only inside its parent's labelled time; siblings
# overlap freely. Its id is `<event>.<key>` and its files live in
# `<event>/subcategories/<key>/review/`. A new kind (an ELM type) is one more entry.
# `review: false` keeps an event's folder and tables but leaves it off the page and
# the silver set (disruption and VDE, owner 2026-10-11).
taxonomy:
  mhd_n1:
    display: "MHD n=1"
    group: "MHD mode"
    subcategories:
      m1: {display: "1/1 (sawtooth, fishbone)", m: 1, n: 1}
      m2: {display: "2/1 (tearing)", m: 2, n: 1}
      m3: {display: "3/1 (tearing, external kink)", m: 3, n: 1}
  mhd_n2:
    display: "MHD n=2"
    group: "MHD mode"
    subcategories:
      m3: {display: "3/2 (tearing)", m: 3, n: 2}
  mhd_n3:
    display: "MHD n=3"
    group: "MHD mode"
    subcategories:
      m4: {display: "4/3 (tearing)", m: 4, n: 3}
  alfven_eigenmode:
    display: "Alfvén eigenmode (AE)"
    subcategories:
      tae: {display: "TAE (toroidal AE)"}
      rsae: {display: "RSAE (reversed-shear AE)"}
  confinement: {display: "Confinement regime"}
  detachment: {display: "Detachment"}
  edge_localized_mode: {display: "ELM"}
  minimum_safety_factor: {display: "q_min regime"}
  poloidal_beta: {display: "Poloidal beta"}
  resistive_wall_mode: {display: "RWM"}
  disruption: {display: "Disruption", review: false}
  locked_mode: {display: "Locked mode"}
  vertical_displacement_event: {display: "VDE", review: false}

