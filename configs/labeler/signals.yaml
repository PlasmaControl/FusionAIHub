    kind: trace
    events: [mhd_n1, neoclassical_tearing_mode, resistive_wall_mode, locked_mode,
             sawtooth_oscillation]
    sources:
      - {feature: n1rms}
      - {mds: '\MHD::N1RMS', tree: MHD}
  - id: n2rms
