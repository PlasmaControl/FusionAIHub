  # ---- Profiles (a dock panel at the cursor; never a row) ----
  - id: q_profile
    label: "q"
    group: Profiles
    units: ""
    kind: profile
    axis: psi_n
    channels: 65
    events: [mhd_n1, neoclassical_tearing_mode, minimum_safety_factor, alfven_eigenmode,
             sawtooth_oscillation]
