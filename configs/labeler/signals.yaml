# The review page's signal catalog: what "Add signal" offers (plan sections B and D.A).
# Read and validated by `labeler.events.review.catalog`; served by `/api/catalog`,
# `/api/signal` and `/api/profile` (docs/labeler/workspace.md).
#
# Every locator here was checked before it was listed: on disk (a corpus group, a raw
# cache or features-store group whose `locator` attribute names it, the MHD park), or
# by an fdp fetch (stream B's smoke fetch 2026-10-16; R2_CATALOG's probe 2026-10-17,
# which tried every PTDATA point and MDS node below on two reference shots). An entry
# whose source is unverified stays out. Sources are tried in order; local tiers come
# before a fetch.
#
# Entry keys: id, label, group, units, kind (trace | profile), draw (lines | map),
# axis, channels, events (the events it is suggested for), legend, `description` (one
# line, at most 240 characters; the page searches it) and `avail`: which of the two
# reference shots, 170659 (early, 2017) and 200958 (late, 2020), returned data from
# one of the entry's fetched sources: both | early | late. An entry with no fetched
# source (corpus, raw or feature only) has no `avail`. A name typed into the page
# (custom:<PTDATA>, mds:<TREE>:<node>) needs no entry here; add one to make it
# searchable by label and description.
#
# Source kinds:
#   corpus: <group>, rows       foundation_model/<shot>_processed.h5 rows (total: sums them)
#   raw: <group>, rows          $LABELER_ROOT/raw/<shot>_processed.h5, same layout
#   feature: <name>             the features store, then corpus, then raw cache
#                               (`events.equilibrium.signal`: archive lag removed)
#   park: a_q95 | a_qmin        the MHD park's A-EQDSK scalars (EFIT02, else the fallback)
#   ptdata: <NAME>              a PTDATA point, through the fetch worker (30 s)
#   mds: <node>, tree: <TREE>   an MDSplus node, through the fetch worker (30 s);
#                               `free: true` runs it as a free node (120 s, and a 2-D
#                               record is read with its own dimensions)
#   recipe: <name>              a profile reader in `review.profiles` (local) or in
#                               `review.profile_fetch` (fetched: efit0N_*, zipfit0N_*)
# `scale` takes a source's values into the entry's units; `tag` is shown after the label.

signals:
  # ---- Plasma ----
  - id: ip
    label: "Plasma current I_p"
    group: Plasma
    units: MA
    kind: trace
    events: [edge_localized_mode, resistive_wall_mode, locked_mode, poloidal_beta,
             detachment]
    description: "Plasma current from the PTDATA point ip (the features store, the archive read when the shot is not stored)."
    avail: both
    sources:
      - {feature: ip, scale: 1.0e-6}
      - {ptdata: ip, scale: 1.0e-6}
  - id: bt
    label: "Toroidal field B_T"
    group: Plasma
    units: T
    kind: trace
    description: "Toroidal field at the machine axis (PTDATA bt)."
    avail: both
    sources:
      - {feature: bt}
      - {ptdata: bt}
  - id: density
    label: "Line-integrated density, CO2 R0"
    group: Plasma
    units: "cm^-2"
    kind: trace
    events: [alfven_eigenmode, edge_localized_mode, confinement, high_confinement_mode,
             detachment]
    description: "CO2 interferometer R0 chord line-integrated density, stored units (PTDATA DENR0UF)."
    avail: both
    sources:
      - {corpus: co2, rows: 0}
      - {raw: co2, rows: 0}
      - {feature: co2_r0}
      - {ptdata: DENR0UF}
  - id: wmhd
    label: "Stored energy W_MHD"
    group: Plasma
    units: MJ
    kind: trace
    events: [edge_localized_mode, confinement, high_confinement_mode, poloidal_beta]
    description: "Stored energy from the EFIT01 equilibrium (A-EQDSK WMHD), joules scaled to megajoules."
    avail: both
    sources:
      - {feature: wmhd, scale: 1.0e-6, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:wmhd', tree: EFIT01, scale: 1.0e-6, tag: EFIT01}
  - id: vloop
    label: "Loop voltage"
    group: Plasma
    units: V
    kind: trace
    description: "Loop voltage (PTDATA VLOOP), archive units as stored."
    avail: both
    sources:
      - {ptdata: VLOOP}
  - id: diamag
