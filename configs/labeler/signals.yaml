      - {recipe: park_q}
      - {recipe: efit01_q}
  - id: ts_core_te
    label: "Thomson core Te"
    group: Profiles
    units: keV
    kind: profile
    axis: R_m
    channels: 44
    events: [mhd_n1, neoclassical_tearing_mode, sawtooth_oscillation, confinement,
             high_confinement_mode]
    sources:
      - {recipe: thomson_te}
  - id: ts_core_ne
