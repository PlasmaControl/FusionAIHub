    units: MW
    kind: trace
    legend: [15L, 15R, 21L, 21R, 30L, 30R, 33L, 33R]
    description: "Neutral-beam injected power of each of the eight beams (15L 15R 21L 21R 30L 30R 33L 33R), one line each."
