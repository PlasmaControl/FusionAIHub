             TECEF09, TECEF10, TECEF11, TECEF12, TECEF13, TECEF14, TECEF15, TECEF16,
             TECEF17, TECEF18, TECEF19, TECEF20, TECEF21, TECEF22, TECEF23, TECEF24,
             TECEF25, TECEF26, TECEF27, TECEF28, TECEF29, TECEF30, TECEF31, TECEF32,
