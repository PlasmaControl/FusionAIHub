# The review page's signal catalog: what "Add signal" offers (plan sections B and D.A).
# Read and validated by `labeler.events.review.catalog`; served by `/api/catalog`,
# `/api/signal` and `/api/profile` (docs/labeler/workspace.md).
#
# Every locator here was checked before it was listed: on disk (a corpus group, a raw
# cache or features-store group whose `locator` attribute names it, the MHD park), or
# by stream B's fdp smoke fetch (2026-10-16). An entry whose source is unverified stays
# out. Sources are tried in order; local tiers come before a fetch.
#
# Source kinds:
#   corpus: <group>, rows       foundation_model/<shot>_processed.h5 rows (total: sums them)
#   raw: <group>, rows          $LABELER_ROOT/raw/<shot>_processed.h5, same layout
#   feature: <name>             the features store, then corpus, then raw cache
#                               (`events.equilibrium.signal`: archive lag removed)
#   park: a_q95 | a_qmin        the MHD park's A-EQDSK scalars (EFIT02, else the fallback)
#   ptdata: <NAME>              a PTDATA point, through the fetch worker (30 s)
#   mds: <node>, tree: <TREE>   an MDSplus node, through the fetch worker (30 s)
#   recipe: <name>              a profile reader in `review.profiles`
# `scale` takes a source's values into the entry's units; `tag` is shown after the label.

signals:
  # ---- Plasma ----
  - id: ip
    label: "Plasma current I_p"
    group: Plasma
    units: MA
    kind: trace
    events: [edge_localized_mode, resistive_wall_mode, locked_mode, poloidal_beta, detachment]
    sources:
      - {feature: ip, scale: 1.0e-6}
      - {ptdata: ip, scale: 1.0e-6}
  - id: bt
    label: "Toroidal field B_T"
    group: Plasma
    units: T
    kind: trace
    sources:
      - {feature: bt}
      - {ptdata: bt}
  - id: density
    label: "Line-integrated density, CO2 R0"
    group: Plasma
    units: "cm^-2"
    kind: trace
    events: [alfven_eigenmode, edge_localized_mode, confinement, high_confinement_mode, detachment]
    sources:
      - {corpus: co2, rows: 0}
      - {raw: co2, rows: 0}
      - {feature: co2_r0}
      - {ptdata: DENR0UF}
  - id: wmhd
    label: "Stored energy W_MHD"
    group: Plasma
    units: MJ
    kind: trace
    events: [edge_localized_mode, confinement, high_confinement_mode, poloidal_beta]
    sources:
      - {feature: wmhd, scale: 1.0e-6, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:wmhd', tree: EFIT01, scale: 1.0e-6, tag: EFIT01}
  - id: betan
    label: "beta_N"
    group: Equilibrium
    units: ""
    kind: trace
    events: [mhd_n1, neoclassical_tearing_mode, resistive_wall_mode, minimum_safety_factor,
             poloidal_beta, alfven_eigenmode, confinement, high_confinement_mode]
    sources:
      - {feature: betan, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:betan', tree: EFIT01, tag: EFIT01}
  - id: betap
    label: "beta_p"
    group: Equilibrium
    units: ""
    kind: trace
    events: [poloidal_beta, minimum_safety_factor]
    sources:
      - {feature: betap, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:betap', tree: EFIT01, tag: EFIT01}
  - id: li
    label: "Internal inductance l_i"
    group: Equilibrium
    units: ""
    kind: trace
    events: [resistive_wall_mode, poloidal_beta]
    sources:
      - {feature: li, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:li', tree: EFIT01, tag: EFIT01}
  - id: q95
    label: "q95"
    group: Equilibrium
    units: ""
    kind: trace
    events: [mhd_n1, neoclassical_tearing_mode, minimum_safety_factor, locked_mode]
    sources:
      - {park: a_q95}
      - {feature: q95, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:q95', tree: EFIT01, tag: EFIT01}
  - id: qmin
    label: "q_min"
    group: Equilibrium
    units: ""
    kind: trace
    events: [mhd_n1, neoclassical_tearing_mode, minimum_safety_factor, alfven_eigenmode,
             sawtooth_oscillation]
    sources:
      - {park: a_qmin}
      - {feature: qmin, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:qmin', tree: EFIT01, tag: EFIT01}
  - id: kappa
    label: "Elongation kappa"
    group: Equilibrium
    units: ""
    kind: trace
    sources:
      - {feature: kappa, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:kappa', tree: EFIT01, tag: EFIT01}
  - id: tritop
    label: "Upper triangularity"
    group: Equilibrium
    units: ""
    kind: trace
    sources:
      - {feature: tritop, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:tritop', tree: EFIT01, tag: EFIT01}
  - id: tribot
    label: "Lower triangularity"
    group: Equilibrium
    units: ""
    kind: trace
    sources:
      - {feature: tribot, tag: EFIT01}
      - {mds: '\efit01::top.results.aeqdsk:tribot', tree: EFIT01, tag: EFIT01}

  # ---- Heating ----
  - id: pinj_total
    label: "NBI power, 8 beams summed"
    group: Heating
    units: MW
    kind: trace
    events: [alfven_eigenmode, edge_localized_mode, confinement, high_confinement_mode,
             resistive_wall_mode, detachment]
    sources:
      - {corpus: pinj, rows: "0-7", total: true, scale: 1.0e-6}
      - {raw: pinj, rows: "0-7", total: true, scale: 1.0e-6}
      - {feature: pinj_total, scale: 1.0e-3}
  - id: pinj_beams
    label: "NBI power per beam"
    group: Heating
    units: MW
    kind: trace
    legend: [15L, 15R, 21L, 21R, 30L, 30R, 33L, 33R]
    sources:
      - {corpus: pinj, rows: "0-7", scale: 1.0e-6}
      - {raw: pinj, rows: "0-7", scale: 1.0e-6}
  - id: tinj_total
    label: "NBI torque, 8 beams summed"
    group: Heating
    units: "N m"
    kind: trace
    events: [resistive_wall_mode, locked_mode]
    sources:
      - {corpus: tinj, rows: "0-7", total: true}
      - {feature: tinj_total}
  - id: ech_total
    label: "ECH power, 12 gyrotrons summed"
    group: Heating
    units: MW
    kind: trace
    events: [confinement, high_confinement_mode, sawtooth_oscillation]
    sources:
      - {corpus: ech_power, rows: "0-11", total: true, scale: 1.0e-6}
      - {feature: ech_power_total, scale: 1.0e-6}

  # ---- Magnetics ----
  - id: n1rms
    label: "n=1 RMS"
