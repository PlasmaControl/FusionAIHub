version: 1
# Non-actuator signals. group/col address the d3d_fusion_data layout (staged and fetched files alike);
# fetch names the toksearch node for shots we fetch ourselves; fetch: null means the quantity only
# exists in staged files (profile fits), so a missing value is "unavailable", never "pending".
efit_provenance: &efit {tool: EFIT, version: "01", tree: efit01, assumed_for_staged: true}
signals:
  # ipsip is stored in megaamps, not amps: on /scratch/gpfs/EKOLEMEN/d3d_fusion_data/161172.h5,
  # ip/ipsip ranges to 1.037 while ip/iptipp (same group, declared amps) ranges to 9.98e5, and
  # mag_others/ip (the same physical quantity from a different diagnostic) ranges to ~1.03e6 --
  # all consistent with ipsip being ~1e6x too small if taken at face value as amps. scale corrects
  # this, so units: A below is true only after scaling. fetch.node is ipsip (matching col, not a
  # bare "ip" node) so a shot we fetch ourselves lands in the same column/unit convention as the
  # staged files and this one scale factor is correct for both locations.
  ip:        {group: ip, col: ipsip, units: A, tier: raw, abs: true, scale: 1.0e+6, stats: [mean, peak, min, slope], fetch: {kind: ptdata, node: ipsip}}
  # ip_target needs write_scale, ip does not, and the reason is that iptipp is a PCS *voltage*
  # request while ipsip is already a current. Both PTDATA nodes declare units "vo": fetching
  # 161172 gives |ipsip|max = 1.0369 and |iptipp|max = 1.99664, while the staged columns are
  # 1.0369 and 998321. So ipsip lands in the staged convention untouched (measured ratio exactly
  # 1 on 160904/161172/161405) and iptipp does not -- the staged producer multiplied it by
  # 500,000 A/V (median staged/fetched = 500000 to 8 significant figures on all three shots).
  # Constant across campaigns, checked without a staged file by comparing iptipp*5e5 against the
  # measured ipsip*1e6 over each shot's flat top: 160904 0.985, 165197 0.972, 172000 0.980,
  # 185800 0.990, 190154 0.974, 196000 0.994, 204988 1.002 (178000 is a 34 kA no-plasma shot with
  # 6 flat-top samples and is not evidence either way). write_scale is applied by
  # scripts/fetch_shots.py at WRITE time, deliberately not by the reader's `scale`: `scale` is one
  # number for a signal wherever it lives, and the staged files already carry the factor, so
  # correcting on read would double-apply it to every staged shot.
  ip_target: {group: ip, col: iptipp, units: A, tier: raw, abs: true, stats: [peak], fetch: {kind: ptdata, node: iptipp, write_scale: 5.0e+5}}
  bt:        {group: mag_b0, col: bt, units: T, tier: raw, abs: true, stats: [mean], fetch: {kind: ptdata, node: bt}}
  vloop:     {group: mag_others, col: vloop, units: V, tier: raw, stats: [mean], fetch: {kind: ptdata, node: vloop}}
  # There is no PTDATA pointname for either of these: denv2, densv2, denv2f and fs04/fs04d/fs04da
  # all raise PtDataError on 161172. Both live in their own MDSplus tree, and both reproduce the
  # staged column exactly (median staged/fetched over 0-6000 ms on 161172: 1.0000001 and 1
  # respectively; the fetched sample counts, 8995 and 160000, equal the staged group lengths).
  # \BCI::DENV2 is \ELECTRONS::TOP.BCI.MAIN:DENV2 (the bci tree is a subtree of electrons); the
  # BCI leaf's own units attribute reads "m/cm3" (checked on shot 205911, 2026-09-05): path length
  # in METRES times density in cm^-3, DIII-D's mixed line-integral convention, so |max| ~ 2e14
  # over a ~2 m chord is ~1e14 cm^-3 = 1e20 m^-3. The 'V' our fetch recorded came from the bci
  # tag, not the leaf. flags.rules._greenwald_frac divides by the chord path length from EFIT.
  # denv2uf is the 960 kHz unfiltered version of the same chord and belongs to co2_density.
  ne_line:   {group: co2_density_slow, col: v2, units: m/cm3, tier: raw, stats: [mean, peak], fetch: {kind: mds, tree: bci, node: "\\BCI::DENV2"}}
  dalpha:    {group: d_alpha, col: fs04, units: ph/cm2/sr/s, tier: raw, stats: [mean, std], fetch: {kind: mds, tree: spectroscopy, node: "\\SPECTROSCOPY::FS04"}}
  neutrons:  {group: neutron, col: fzns, units: "[?]", tier: raw, stats: [mean, peak], fetch: {kind: ptdata, node: fzns}}
  nbi_target_total: {group: nbi_target, col: bmspinj, units: "MW or kW (inferred per shot)", tier: raw, stats: [peak], fetch: {kind: ptdata, node: bmspinj}}
  n1rms:     {group: mag_mode_number, col: n1rms, units: G, tier: derived, stats: [mean, peak], provenance: {tool: mode_rms, version: "[?]"}, fetch: {kind: mds, tree: mhd, node: "\\MHD::N1RMS"}}
  n2rms:     {group: mag_mode_number, col: n2rms, units: G, tier: derived, stats: [mean, peak], provenance: {tool: mode_rms, version: "[?]"}, fetch: {kind: mds, tree: mhd, node: "\\MHD::N2RMS"}}
  betan:     {group: beta, col: betan, tier: derived, stats: [mean, peak], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:BETAN"}}
  betap:     {group: beta, col: betap, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:BETAP"}}
  q95:       {group: q_psi, col: q95, tier: derived, stats: [mean, min], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:Q95"}}
  qmin:      {group: q_psi, col: qmin, tier: derived, stats: [mean, min], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:QMIN"}}
  q0:        {group: q_psi, col: q0, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:Q0"}}
  kappa:     {group: mag_geo_para, col: kappa, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:KAPPA"}}
  tritop:    {group: mag_geo_para, col: tritop, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:TRITOP"}}
  tribot:    {group: mag_geo_para, col: tribot, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:TRIBOT"}}
  aminor:    {group: mag_geo_para, col: aminor, units: m, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:AMINOR"}}
  r0:        {group: mag_geo_para, col: r0, units: m, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:R0"}}
  volume:    {group: mag_geo_para, col: volume, units: m^3, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:VOLUME"}}
  li:        {group: other_profiles, col: li, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:LI"}}
  wmhd:      {group: other_profiles, col: wmhd, units: J, tier: derived, stats: [mean, peak], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:WMHD"}}
  # EFIT's divertor-geometry solver saturates at +-0.4 m when the strike-point search hits the
  # edge of its computational domain -- swept across every staged file with a drsep column:
  # 514 shots carry the exact same float32 value at the low end (62,981 samples total) and 627
  # carry the exact same value at the high end (13,200 samples), always bit-for-bit identical and
  # never anything merely nearby, i.e. a clamp, not noise. The two literals below are NOT a
  # rounded +-0.4: what EFIT actually writes is one ULP away from Python's own float32(0.4), so
  # the naive decimal would silently null nothing on a real file. null_value as a list nulls both
  # ends the same way zxpt1's single value nulls its one sentinel.
  drsep:     {group: divertor_geo, col: drsep, units: m, tier: derived, null_value: [-0.3999999761581421, 0.3999999761581421], stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:DRSEP"}}
  gapin:     {group: divertor_geo, col: gapin, units: m, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:GAPIN"}}
  gapout:    {group: divertor_geo, col: gapout, units: m, tier: derived, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:GAPOUT"}}
  # -9.99 m is EFIT's "no X-point found" sentinel, not a real position: on the same real file,
  # divertor_geo/zxpt1's minimum is exactly -9.99 while every other sample sits in a normal
  # divertor-geometry range (~-1 to -2.3 m). null_value turns exact matches into NaN on read so a
  # shot with no X-point never corrupts a mean/statistic as if -9.99 were a measurement.
  zxpt1:     {group: divertor_geo, col: zxpt1, units: m, tier: derived, null_value: -9.99, stats: [mean], provenance: *efit, fetch: {kind: mds, tree: efit01, node: "\\EFIT01::TOP.RESULTS.AEQDSK:ZXPT1"}}
  ne0:       {group: e_dens_fit, col: "edensfit0.00", units: "[?]", tier: derived, stats: [mean], provenance: {tool: profile_fit, version: "[?]"}, fetch: null}
  te0:       {group: e_temp_fit, col: "etempfit0.00", units: "[?] keV", tier: derived, stats: [mean], provenance: {tool: profile_fit, version: "[?]"}, fetch: null}
# Waveforms resampled to 20 points per segment for the scalar embedding (names = spec names or system totals).
waveforms: [ip, pnbi_total, pech_total, gas_total, ne_line, betan, q95]
