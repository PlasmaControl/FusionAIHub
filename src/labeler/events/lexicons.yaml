# The phenomenon lexicon: what a DIII-D operator calls each thing.
#
# THIS FILE IS THE SINGLE SOURCE of the round-1 phenomenon ids and their
# aliases (plan 5.6). shot_design reads it too - `configs/shot_design/phenomena.yaml`
# adds the scoring machinery (labels, events, bands, diagnostics, priors)
# around these ids and does NOT restate the alias lists - so an id renamed
# here is renamed in both, and an alias added here is added to both.
#
# `aliases` are lowercase phrases matched WHOLE, by gluing spaces around
# them: punctuation becomes whitespace except a hyphen or a slash inside a
# token, so "elm" does not match "helms" or "elm-free", and "2/1" is one
# token. That is also why the spellings here are the ones the logbook
# actually uses, acronyms included, rather than the textbook names.
#
# `negatives` are phrases whose presence makes the WHOLE sentence a
# statement of absence: a sentence carrying one yields `polarity="neg"`
# hits for that phenomenon and no positive ones. They overlap `aliases` on
# purpose, and they HAVE to: a negative only marks a sentence some alias
# already matched, so every hyphenated negative is also an alias -
# "elm-free" is one token, and " elm " is not inside it. `load_lexicon`
# runs the matcher on each negative phrase alone and refuses one that
# fires nothing, because "sawtooth-free", "eho-free" and "ae-free" shipped
# without their alias and were silently dead. (shot_design's `exclude` is the
# same idea under its own name.) They are otherwise deliberately sparse:
# only phrasings seen in the corpus, because a missing negative costs a
# little and one that fires wrongly silences a real mention.
#
# `weight` (default 1.0) is for the CONSUMER's scoring, not for
# `text_weak`, whose confidence is a flat quarter a mention. What deserves
# a caveat rather than a number nobody measured is the difference between
# the two SCOPES. Measured on the 500 shots of `recommender_v1.txt`, as
# the fraction of shots with at least one positive hit:
#
#   phenomenon   shot scope (logbook)   run scope (session text)
#   elm                 11.0 %                  99.4 %
#   rwm                  1.0 %                  99.4 %
#   tearing              7.2 %                  49.0 %
#   lh                   2.4 %                  42.4 %
#   detachment           2.4 %                  35.0 %
#   sawtooth             0.6 %                  14.6 %
#   qcm                  0.0 %                   0.0 %
#
# A run-scope hit is a sentence every shot of the session shares - an
# experiment title ("pedestal and ELM") or a control-system note ("I-coil
# RWM feedback") - so `elm` and `rwm` at run scope separate almost nothing
# on this set, while the same words in a shot's own logbook entries are
# somebody writing about that shot. Whoever scores run-scope evidence
# should discount it by the size of the run and treat a lone two- or
# three-letter acronym as weaker than a spelled-out name. `qcm` appears in
# 15 of 22,950 bundles corpus-wide: text will not find QCM shots.
version: 1
phenomena:
  ae:
    title: Alfven eigenmode
    aliases:
      - ae
      - tae
      - rsae
      - bae
      - eae
      - alfven eigenmode
      - alfven
      - alfvén
      - ae-free
    negatives:
      - no ae
      - ae-free

  eho:
    title: Edge harmonic oscillation
    aliases:
      - eho
      - edge harmonic oscillation
      - edge harmonic
      - eho-free
    negatives:
      - no eho
      - eho-free

  elm:
    title: Edge localised mode
    aliases:
      - elm
      - elms
      - elmy
      - elming
      - elm-free
    negatives:
      - elm-free
      - elm free
      - no elms
      - without elms

  transient:
    title: Transient activity
    aliases:
      - transient
      - transients
      - transient activity
    negatives:
      - no transients

  tearing:
    title: Tearing mode
    aliases:
      - tearing
      - ntm
      - 2/1
      - 3/2
      - locked mode
    negatives:
      - no tearing

  sawtooth:
    title: Sawtooth
    aliases:
      - sawtooth
      - sawteeth
      - sawtooth crash
      - st crash
      - sawtooth-free
    negatives:
      - no sawteeth
      - sawtooth-free

  fishbone:
    title: Fishbone
    aliases:
      - fishbone
      - fishbones
    negatives: []

  qcm:
    title: Quasi-coherent mode
    aliases:
      - qcm
      - quasi-coherent
    negatives: []

  qh:
    title: Quiescent H-mode
    aliases:
      - qh
      - qh-mode
      - qh mode
      - quiescent h-mode
      - quiescent h mode
    negatives: []

  lh:
    title: L-H transition
    aliases:
      # The id itself, so that every consumer whose "try one of" line prints
      # `lh` also accepts `lh`. It is a real operator spelling too ("LH
      # transition at 2.1s") and it is not the lower-hybrid launcher: DIII-D
      # has none, so the token is unambiguous in this corpus.
      - lh
      - l-h transition
      - lh transition
      - l to h
      - h-mode transition
      - transition to h-mode
    negatives: []

  detachment:
    title: Divertor detachment
    aliases:
      - detach
      - detached
      - detachment
    negatives: []

  pickup:
    title: Instrumental pickup
    aliases:
      - pickup
      - pick-up
      - noise pickup
    negatives: []

  rwm:
    title: Resistive wall mode
    aliases:
      - rwm
      - resistive wall mode
    negatives: []

  # ---------------------------------------------------------------- q-min
  # The three regime bands `events/heuristics.py::qmin_regimes` writes
  # (0.95 < q <= 1.5 / 1.5 < q <= 2 / q > 2, inside the Ip flat-top, over
  # at least 500 ms). Three ids and not one because the bands are what a
  # consumer selects on, and "the shot ran at elevated q-min" and "the shot
  # ran fully above 2" are different scenarios with different physics.
  #
  # Two phrases were considered and LEFT OUT, which is the more informative
  # half of these lists:
  #
  # * bare "qmin" (and "q-min", "q min"). It names the QUANTITY, not a
  #   band: an entry reading "qmin ~ 1.1 at 3 s" and one reading "qmin
  #   climbing past 2" would both hit whichever id carried it, and putting
  #   it on all three would count one mention three times. The rule reads
  #   the equilibrium; the text layer is not the place to guess the band.
  # * "reversed shear". It is NOT a synonym for a high q-min: a monotonic
  #   q profile lifted bodily above 2 has a high q-min and no shear
  #   reversal at all, and a weakly reversed profile can sit under 1.5. It
  #   names a different measurement (dq/drho), which nothing here computes.
  qmin_hybrid:
    title: Hybrid scenario (q-min 0.95-1.5)
    aliases:
      # The id itself, as for `fast_ion`: every id is a phrase `shot_design phenomenon <id>`
      # must accept (shot_design pins it), and an underscore is not a word.
      - qmin_hybrid
      - hybrid
      - hybrid scenario
      - hybrid discharge
      - hybrid shot
    negatives: []

  qmin_elevated:
    title: Elevated q-min (1.5-2)
    aliases:
      # The id itself, as for `fast_ion`: every id is a phrase `shot_design phenomenon <id>`
      # must accept (shot_design pins it), and an underscore is not a word.
      - qmin_elevated
      - elevated q-min
      - elevated qmin
    negatives: []

  qmin_high:
    title: High q-min (above 2)
    aliases:
      # The id itself, as for `fast_ion`: every id is a phrase `shot_design phenomenon <id>`
      # must accept (shot_design pins it), and an underscore is not a word.
      - qmin_high
      - high q-min
      - high qmin
    negatives: []

  # A TOPIC, not a mode. Everything above names something a diagnostic can
  # show; this names the population of ions a dozen different experiments
  # are about. It is here because the words below are what the
  # mini-proposals and the logbook actually use for that work - "Transport
  # of passing and trapped fast ions by static 3D fields", "beam ion losses
  # measured with FIDA" - and before it existed those sentences resolved to
  # NOTHING, or (worse, and the I11 review caught it before it shipped) were
  # about to be aliased into `ae`, which would have turned a diagnostic name
  # into a claim about an Alfven eigenmode.
  #
  # The mode names stay with the mode: `tae`, `rsae`, `bae`, `eae` and
  # `alfven*` are `ae`'s and are not repeated here. A sentence naming both
  # ("TAE-induced ITG turbulence in a fast-ion experiment") resolves to both,
  # which is correct - they are different claims about the same shot.
  fast_ion:
    title: Fast-ion physics
    aliases:
      # The id itself. Nobody writes an underscore in a logbook, but every id
      # in this file is a phrase that `shot_design phenomenon <id>` and the "try one
      # of" line it prints must both accept, and `fast_ion` is the first id
      # that is not a bare word. A test pins the rule for every id.
      - fast_ion
      - fast ion
      - fast-ion
      - fast ions
      - fast-ions
      - energetic particle
      - energetic particles
      - energetic ion
      - energetic ions
      - beam ion
      - beam ions
      - fida
      - epm
      - fast ion transport
    negatives: []
