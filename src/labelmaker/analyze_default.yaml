# What `python -m labelmaker.run analyze` produces and plots for a shot.
# Edit a copy and pass it with --config; this file is the default.

# Labels, as <model folder>/<output name>, plotted top to bottom in this order.
labels:
  - d3d_tearing_onset_cnn1d/tm_prob
  - d3d_tearing_time_to_event_dsm/tm_risk_1s
  - d3d_tearing_time_to_event_dsm/tm_time_p50
  - d3d_tearing_onset_cnn1d/betan

# Canonical features (features/namespace.py) drawn above the labels for
# orientation. They are fetched like model inputs if not already stored.
context:
  - ip
  - pinj_total

# Drawn on binary labels, and where `first_above_threshold` is measured.
threshold: 0.5

# Per-label overrides. The survival model's risk is a probability of onset
# within the horizon, on a different scale from the CNN's probability that a
# mode is already present.
thresholds:
  d3d_tearing_time_to_event_dsm/tm_risk_1s: 0.2
