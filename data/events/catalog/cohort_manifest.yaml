keys: sha256 of '<seed>:<purpose>:<shot>', its first 8 bytes as a big-endian unsigned
  integer, / 2**64; purposes draw (the cell sample) and order (u)
rules:
  shot_range:
  - 185601
  - 204999
  rule_1:
    shot_type: plasma
    min_abs_ip_ma: 0.5
    min_pulse_length_s: 2.0
    min_pbeam_mw: 1.0
    pech_max_mw_gt: 0.0
    heating: PBEAM-MAX >= min_pbeam_mw or PECH-MAX > pech_max_mw_gt
  rule_2:
    own_shot_table_block: true
    empty_title_fallback: 'first Experiment: line in the ### CHIEF_OPERATOR SUMMARY
      block'
    machine_time:
      pattern: (?i)^\s*(?:plasma\s+)?(?:start-?up|starup)\b|^\s*power\s+systems?\s+test
      lexicon_theme: startup_checkout
      assignment: physics themes first, title and mini-proposal subject
  rule_3:
    groups:
    - mhr
    - ece
    - filterscopes
    min_group_span_s: 2.0
  rule_4:
    log_version: 2
    ip: PTDATA ip, native rate
    window: Longest stretch of s * Ip >= window_ip_a, where s is the sign of the finite
      sample of largest |Ip| (zero is positive), bridging gaps of at most bridge_ms
      and rounding edges to us then inward to whole ms.
    window_ip_a: 50000.0
    bridge_ms: 10.0
    flattop: select.flattop_from_ip on centred flattop_mean_ms means of finite |Ip|
      inside the window, with h = round(flattop_mean_ms / 2 / median dt), over i-h
      through i+h, and NaN for incomplete or empty spans.
    flattop_mean_ms: 25.0
    flattop_fraction: 0.8
    min_flattop_s: 1.0
    max_ip_dt_ms: 0.5
    measured_on: every shot passing rules 1-3
  dropped:
    shot_text:
      min_shot_chars: 0
    flattop: select.eligible pulse-length flattop proxy
    title: (?i)\b(?:test|ps|bcoil|abort|mag\s+cal)\b
  groups: 'L: >= 1 verified OSTI link; G: in a legacy table; R: the rest'
  caps:
    L: 200
    G: 100
  cohort_size: 500
  allocation: largest remainder across years within a group, >= 1 per non-empty cell
  blind_size: 50
  val_size: 50
