seed: 20260923
keys: sha256 of '<seed>:<purpose>:<shot>', its first 8 bytes as a big-endian unsigned
  integer, / 2**64; purposes draw (the cell sample) and order (u)
rules:
  shot_range:
  - 185601
  - 204999
  rule_1:
    shot_type: plasma
    min_abs_ip_ma: 0.5
    min_pulse_length_s: 2.0
    min_pbeam_mw: 1.0
    pech_max_mw_gt: 0.0
    heating: PBEAM-MAX >= min_pbeam_mw or PECH-MAX > pech_max_mw_gt
  rule_2:
    own_shot_table_block: true
    empty_title_fallback: 'first Experiment: line in the ### CHIEF_OPERATOR SUMMARY
      block'
    machine_time:
      pattern: (?i)^\s*(?:plasma\s+)?(?:start-?up|starup)\b|^\s*power\s+systems?\s+test
      lexicon_theme: startup_checkout
      assignment: physics themes first, title and mini-proposal subject
  rule_3:
    groups:
    - mhr
    - ece
    - filterscopes
    min_group_span_s: 2.0
  rule_4:
    log_version: 3
    ip: PTDATA ip, native rate
    window: Longest stretch of s * Ip >= window_ip_a, where s is the sign of the largest-magnitude
      centred flattop_mean_ms mean of signed Ip over the whole record, with h = round(flattop_mean_ms
      / 2 / median dt), over i-h through i+h; if no mean is finite, use the finite
      sample of largest |Ip| (zero is positive), bridging gaps of at most bridge_ms
      and rounding edges to us then inward to whole ms.
    window_ip_a: 50000.0
    bridge_ms: 10.0
    flattop: select.flattop_from_ip on centred flattop_mean_ms means of finite |Ip|
      inside the window, with h = round(flattop_mean_ms / 2 / median dt), over i-h
      through i+h, and NaN for incomplete or empty spans.
    flattop_mean_ms: 25.0
    flattop_fraction: 0.8
    min_flattop_s: 1.0
    restrike: Inside the D2a window use the same centred means as flattop; drop non-finite
      means and take their 95th percentile P. After the longest run >= flattop_fraction
      * P (first on a tie), find the first mean < restrike_dip_fraction * P and the
      first later mean > restrike_rise_fraction * P. End at the lowest mean between
      them, rounded down to whole ms; remeasure flat-top and peak inside it.
    restrike_dip_fraction: 0.3
    restrike_rise_fraction: 0.6
    max_ip_dt_ms: 0.5
    measured_on: every shot passing rules 1-3
  dropped:
    shot_text:
      min_shot_chars: 0
    flattop: select.eligible pulse-length flattop proxy
    title: (?i)\b(?:test|ps|bcoil|abort|mag\s+cal)\b
  rule_5:
    threshold_ev: 60.0
    statistic: 'Median over assessed-window samples of the 90th percentile of finite,
      positive ts_core_temp channels, in eV; samples with no valid channel omitted.
      A profile sample has at least ceil(n_channels / 2) finite, positive channels;
      n_profile counts profile samples and n_thomson counts samples with any valid
      channel. Te uses all such samples when n_profile > 0. no_thomson means no usable
      Thomson profile in the window (n_profile == 0): blank Te and retained.'
    comparison: te_p90_ev < threshold_ev
    no_thomson: retain
  groups: 'L: >= 1 verified OSTI link; G: in a legacy table; R: the rest'
  caps:
    L: 200
    G: 100
  cohort_size: 500
  allocation: largest remainder across years within a group; remainder ties go to
    the first cell by name; each non-empty cell left at zero, in name order, takes
    one shot from the cell furthest above its quota among those with more than one
    shot (donor ties go to the last cell by name)
  blind_size: 50
  val_size: 50
