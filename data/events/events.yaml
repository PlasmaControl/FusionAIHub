version: 1

interval_schema:
  version: 1
  columns:
    - shot
    - category
    - t_start
    - t_end
    - confidence
  time_units: ms

label_grid:
  formatted_shots: "format/shots/<shot>.npz"
  extended_shots: "extend_<producer>/<shot-list>/<shot>.npz"
  version: 1
  sample_interval_ms: 50
  axis_order: [time, rho]
  time_units: ms
  rho_bins: 20
  rho_range: [0.0, 1.0]
  classes:
    default:
      0: absent
      1: present
    minimum_safety_factor:
      0: absent
      1: low
      2: hybrid
      3: elevated
      4: high

