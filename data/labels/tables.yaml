version: 1

# One entry per curated table. Adding a table is an entry here, never a code
# edit; `src/labelmaker/events/databases.py` is the only reader.
#
# stem       the file is <dir>/<stem>.csv, and the source of every row it
#            produces is `database:<stem>`; unique across the manifest
# dir        directory under data/labels/, one per phenomenon
# phenomenon a `events/lexicons.yaml` id, validated at load - the directory
#            name is prose, this is the join key
# kind       point (t_col) | interval (t0_col, t1_col)
# t_units    ms | s - converted to seconds ON LOAD, never on disk
# attr_cols  carried verbatim into each event's `attrs`
# provenance who made the table, and from what

tables:
  - stem: rwm_onsets_2017
    dir: resistive_wall_mode
    phenomenon: rwm
    kind: point
    shot_col: SHOT
    t_col: ONSET_TIME
    t_units: ms
    attr_cols: [NTOR, MODE_TYPE]
    attr_types: {NTOR: int, MODE_TYPE: str}
    provenance: "Jeremy Hansen, 2017 campaign RWM onset database"

  - stem: rwm_onsets_2024
    dir: resistive_wall_mode
    phenomenon: rwm
    kind: point
    shot_col: SHOT
    t_col: ONSET_TIME
    t_units: ms
    attr_cols: [NTOR, MODE_TYPE]
    attr_types: {NTOR: int, MODE_TYPE: str}
    provenance: "Jeremy Hansen, 2024 campaign RWM onset database"
