[project]
name = "faith"
requires-python = ">= 3.11"
authors = [
  { name = "Azarakhsh Jalalvand", email = "azarakhsh.jalalvand@princeton.edu" },
  { name = "Kouroche Bouchiat", email = "bouchiat@princeton.edu" },
  { name = "Nathaniel Chen", email = "nathaniel@princeton.edu" },
  { name = "Peter Steiner", email = "peter.steiner@princeton.edu" },
]
dependencies = [
  "einops>=0.8.2,<0.9",
  "h5py>=3.15.1,<4",
  # imageio + imageio-ffmpeg used by scripts/training/eval_e2e_stage1_phase3_1_video.py
  # to write video stitched plots as mp4. imageio-ffmpeg ships a static
  # ffmpeg binary, so the encoder works on Frontier without an OS-level
  # ffmpeg package. Listed in [project] (shared across default / fdp /
  # frontier features) so every env carries the same encoder.
  "imageio>=2.30,<3",
  "imageio-ffmpeg>=0.4.9,<1",
  "ipykernel>=7.2.0,<8",
  "ipywidgets>=8.1.8,<9",
  "matplotlib>=3.10.8,<4",
  "numpy>=1.26.4,<3",
  # Image-processing libs for tokamak-animation cam ↔ PNG alignment
  # (cv2.findTransformECC + skimage.registration).
  "opencv-python-headless>=4.10,<5",
  "scikit-image>=0.24,<0.26",
  "pandas>=3.0.0,<4",
  "scipy",
  "tables>=3.10.2,<4",
  "torch",
  "torchmetrics>=1.9.0,<2",
  "torchinfo>=1.8.0,<2",
  "torchvision",
  "transformers>=5.1.0,<6",
  "pytest>=9.0.2,<10",
  "tensorboard>=2.20.0,<3",
  "wandb>=0.25.1,<0.26",
  "hydra-core", "vector-quantize-pytorch>=1.31.0,<2", "x-transformers>=2.23.5,<3",
]
dynamic = ["version"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/faith/__init__.py"

[tool.hatch.build.targets.wheel]
# Four top-level packages live under src/. Without this list hatchling
# autodiscovers only the one matching the project name (faith), so
# `import labelmaker` (and now `import ideate`) fails in every pixi env.
packages = ["src/faith", "src/tokamak_foundation_model", "src/labelmaker", "src/ideate"]

[tool.pixi.workspace]
channels = ["conda-forge", "ga-fdp"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
faith = { path = ".", editable = true }

[tool.pixi.target.osx.pypi-dependencies]
# No CUDA support on macOS, use `cpu` wheels.
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.cuda]
platforms = ["linux-64", "win-64"]

[tool.pixi.feature.cuda.pypi-dependencies]
torch = { version = ">=2.5.1,<2.11", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.20.1,<0.22", index = "https://download.pytorch.org/whl/cu124" }

[tool.ruff]
line-length = 88

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.11,<3.12"
hydra-core = ">=1.3.2,<2"
line_profiler = ">=5.0.2,<6"

[tool.pixi.feature.fdp]
platforms = ["linux-64"]

# MEASURED 2026-09-04 (Task 16b): `import torch` binds the SYSTEM
# `/lib64/libstdc++.so.6`, which lacks `GLIBCXX_3.4.29`. Every compiled
# extension in this feature that needs that symbol then fails to import
# after torch does - `toksearch_d3d` (via `fdp` -> `pyxrootd`) and `scipy` -
# with a bare `ImportError`, which `resolve_fdp.available()` swallowed into
# an indistinguishable `ToksearchUnavailable` and silently disabled the
# whole fdp scaling path. The pixi env ships its OWN
# `lib/libstdc++.so.6.0.36`, which DOES have the symbol; it is just not
# first on the loader's path. `LD_LIBRARY_PATH` (rather than `LD_PRELOAD`) is
# sufficient: verified that with it set, `torch` followed by `fdp`,
# `toksearch`, `toksearch_d3d` and `scipy` all import, which means torch's
# extensions carry `DT_RUNPATH` (which `LD_LIBRARY_PATH` overrides), not
# `DT_RPATH` (which it would not). Scoped to this feature - not the shared
# workspace - because it is `fdp`'s own packages (toksearch/toksearch_d3d,
# via pyxrootd) that need the symbol; both the `fdp` and `labelmaker`
# environments include this feature, so both are covered. Prepended, never
# overwritten: an inherited `LD_LIBRARY_PATH` (e.g. from a module-loaded
# library on a SLURM node) must still take effect first for anything it
# already covers.
[tool.pixi.feature.fdp.target.unix.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

[tool.pixi.feature.fdp.dependencies]
# Versions match Nathan's working fetch env (/scratch/gpfs/nc1514/fdp/pixi.toml)
# rather than floating. `fdp` itself is REQUIRED, not optional: `toksearch_d3d`
# imports it at module scope, so leaving it out resolved an env where
# `import toksearch_d3d` raised ModuleNotFoundError while `toksearch` imported
# fine - the fdp path was unreachable and nothing said so.
fdp = { version = ">=0.5.1,<0.6", channel = "ga-fdp" }
toksearch = { version = ">=2.8.1,<3", channel = "ga-fdp" }
toksearch_d3d = { version = ">=0.10.1,<0.11", channel = "ga-fdp" }

[tool.pixi.feature.labelmaker]
platforms = ["linux-64"]

[tool.pixi.feature.labelmaker.tasks]
# `pixi run -e labelmaker label 187199`: every implemented model on one shot ->
# labels as HDF5 + npz, a JSON summary and one figure (scripts/labelmaker/label_shot.sh).
label = "bash scripts/labelmaker/label_shot.sh"

[tool.pixi.feature.labelmaker.dependencies]
# labels_index.parquet. pandas 3 can write parquet only through pyarrow,
# and the default env does not have it.
pyarrow = ">=17,<22"
# registry.py parses every model card's YAML front matter. `yaml` currently
# reaches this environment only transitively, via hydra-core -> omegaconf,
# and hydra-core is declared in [project] for IGNITE's benefit, not
# labelmaker's - anyone tidying IGNITE's dependencies would silently break
# every card read in this package. Declare it directly.
pyyaml = ">=6,<7"
# Solving `labelmaker` (labelmaker + fdp + the implicit default feature)
# against live conda-forge picks up protobuf 7.35.1, published to
# conda-forge sometime after pixi.lock's other environments were last
# solved (2026-07-31, per `git log -- pixi.lock`). The shared
# [project.dependencies] pin `wandb>=0.25.1,<0.26` needs
# protobuf>4.21.0,!=5.28.0,!=5.29.0,<7, so the two are unsatisfiable
# together:
#
#   Because wandb==0.25.1 depends on one of:
#       protobuf>4.21.0,<5.28.0 / >5.28.0,<5.29.0 / >5.29.0,<7
#   and protobuf==7.35.1, we can conclude that wandb==0.25.1 cannot be used.
#   help: protobuf==7.35.1 has been pinned by the conda solve.
#
# This is channel drift, not a toksearch/torch conflict (the brief's
# anticipated failure mode and documented CPU-wheel-drop fallback, tried
# first, did not change this error). It reproduced identically with and
# without the two pypi-dependencies lines below and with pyarrow removed
# entirely, isolating the cause to protobuf's rolling conda-forge version
# rather than to either of those. The already-locked `fdp`/`default`
# environments are unaffected since they stay pinned to their 2026-07-31
# solve (libprotobuf/protobuf 6.31.1) until someone reruns `pixi update`.
# Pinning protobuf here, scoped to this feature only, keeps the new
# environment on the same already-known-good major version, the same way
# `feature.cuda` pins torch's index rather than editing [project].
protobuf = "<7"

[tool.pixi.feature.labelmaker.pypi-dependencies]
# The workspace installs `faith` editable into every environment, which
# drags torch in. Labelmaker never uses a GPU (its heaviest model is 12k
# parameters evaluated in torch on CPU, see models/runners/keras_h5.py), so
# take the CPU wheels and save ~3 GB in an environment that would otherwise
# duplicate cu124.
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.ideate]
platforms = ["linux-64"]

[tool.pixi.feature.ideate.tasks]
# `pixi run -e ideate ideate search --text "..."`: the shot analysis and
# experiment-design CLI (phenomenon search, events, IGNITE what-if).
ideate = "python -m ideate"
# The MCP server, stdio transport, for an assistant to connect to.
ideate-mcp = "python -m ideate.mcp"
ideate-test = "pytest tests/ideate -q"

[tool.pixi.feature.ideate.dependencies]
# ideate is ported from the shot-recommender-system repo
# (/scratch/gpfs/nc1514/shot-recommender-system), which pins its runtime
# through a uv.lock. Every range here was checked on 2026-09-07 against the
# versions that lock actually resolves - pydantic 2.13.5, fastapi 0.141.1,
# sentence-transformers 6.0.1, httpx 0.28.1, pypdf 6.16.2, scikit-learn
# 1.9.0 - so none of them had to be widened; a range that excluded the
# running version would produce a port that passes here and fails there.
# `mcp` and `duckdb` have no counterpart in that lock (the MCP server and
# the DuckDB-backed store are new in this port).
#
# Everything below is a CONDA dependency: conda-forge carries current builds
# of the whole set (`mcp` 2.1.1 was published there on 2026-08-26), and the
# conda solver is the one that also chooses this environment's python. The
# single exception is `sentence-transformers`, which has to come from pypi -
# see the [feature.ideate.pypi-dependencies] block below for why.

# shots.parquet and the per-segment tables. Same range as feature.labelmaker
# so the two packages cannot end up wanting different pyarrow majors in an
# environment that includes both; shotrec only asks for `pyarrow>=16`.
pyarrow = ">=17,<22"
# phenomena.yaml, actuators.yaml and the model cards ideate reads. Declared
# directly for the same reason feature.labelmaker declares it: `yaml`
# otherwise arrives only transitively through hydra-core -> omegaconf, which
# is in [project] for IGNITE's sake and could be tidied away at any time.
pyyaml = ">=6,<7"
# The schema layer (PhenomenonHit, DesignReport, CircumstanceReport, ...).
# >=2.12 is also conda-forge `mcp`'s own floor, so this is not a free choice.
pydantic = ">=2.12,<3"
# Signal processing behind the segment finder and the circumstances stats.
# Unpinned to match [project], which also lists a bare `scipy`.
scipy = "*"
scikit-learn = ">=1.5,<2"
# Corpus reads: the DIII-D shot HDF5 files under $IDEATE_CORPUS.
h5py = ">=3.15,<4"
tqdm = ">=4.66,<5"
# Miniproposal PDFs -> the text that phenomenon search quotes from.
pypdf = ">=4,<7"
httpx = ">=0.27,<1"
# `ideate serve`: the browser UI. Kept in the base feature rather than a
# separate one because the MCP server and the UI share the same query layer.
fastapi = ">=0.115,<1"
uvicorn = ">=0.30,<1"
# `from mcp.server import MCPServer`. 2.x only: FastMCP, the 1.x entry point,
# is gone, so a solve that fell back to mcp 1.x would import-error rather
# than merely behave differently.
mcp = ">=2.1,<3"
pytest = ">=9,<10"
# Same channel-drift pin, and the same reason, as feature.labelmaker: a live
# conda-forge solve picks up protobuf 7.x, which the shared [project] pin
# `wandb>=0.25.1,<0.26` (protobuf<7) cannot satisfy. Scoped to this feature;
# the already-locked environments stay on their own solve.
protobuf = "<7"
# The shot/segment/label store ideate queries. conda-forge ships the Python
# bindings as `duckdb`.
duckdb = ">=1.1,<2"

[tool.pixi.feature.ideate.pypi-dependencies]
# MiniLM text embeddings (sentence-transformers/all-MiniLM-L6-v2, 384-d).
# The 6.x major is what shotrec runs; 5.x renamed enough of the encode path
# that a lower floor would not be the code that was ported.
#
# This is the ONE package of the set that is taken from pypi rather than
# conda-forge, and it is the fallback the spec anticipated. conda-forge does
# publish it (6.0.1), but its recipe depends on `pytorch >=1.11.0`, so adding
# it to [feature.ideate.dependencies] makes the conda solver choose torch -
# it picks the newest, 2.12.0 - and pixi then hands that as a PINNED version
# to the pypi solve, where it collides head-on with feature.cuda:
#
#   x failed to solve the pypi requirements of environment 'ideate'
#   `-> Because you require torch>=2.5.1,<2.11 and torch==2.12.0, we can
#       conclude that your requirements are unsatisfiable.
#   help: torch==2.12.0 has been pinned by the conda solve.
#
# The cu124 range in feature.cuda is not ours to widen (cu124 is what ships
# sm_70 kernels for the V100S cards these environments run on), and neither
# environment wants a second copy of torch. Taking sentence-transformers from
# pypi keeps torch entirely on the pypi side, where feature.cuda and
# feature.ideate-cpu already decide which wheel each environment gets.
sentence-transformers = ">=6,<7"

# Absolute paths rather than repo-relative ones: the corpus and the label
# store live outside this checkout, on /scratch/gpfs/EKOLEMEN, and the same
# environment is used from a login node, a SLURM job and an MCP client
# launched by an assistant, none of which share a working directory.
# HF_HUB_OFFLINE: sentence-transformers reaches into huggingface_hub on every
# model load even when the MiniLM checkpoint is already cached, and on a
# compute node with no outbound route that call does not fail - it HANGS,
# for minutes, inside httpx.connect_tcp (measured in shotrec, see the same
# note at the top of its cli.py). The checkpoint is in
# ~/.cache/huggingface/hub, so offline is the correct and much faster mode.
# TOKENIZERS_PARALLELISM: the corpus build forks worker processes after a
# tokenizer has been used; without this, every fork prints the HuggingFace
# deadlock warning and the fast tokenizer disables its own threads anyway.
[tool.pixi.feature.ideate.target.unix.activation.env]
IDEATE_DATA_ROOT = "/scratch/gpfs/EKOLEMEN/nc1514/ideate"
LABELMAKER_ROOT = "/scratch/gpfs/EKOLEMEN/nc1514/labelmaker"
IDEATE_CORPUS = "/scratch/gpfs/EKOLEMEN/foundation_model"
HF_HUB_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"

[tool.pixi.feature.ideate-cpu]
platforms = ["linux-64"]

[tool.pixi.feature.ideate-cpu.pypi-dependencies]
# A CPU-only twin of the `ideate` environment, exactly as feature.labelmaker
# does it. The workspace installs `faith` editable everywhere, which drags
# torch in, and the cu124 wheels are ~3 GB that a laptop-shaped run of
# ideate - phenomenon search, the events tables, the MiniLM encoder - never
# touches. Only `design_rollout` needs a GPU, and that is what the `ideate`
# environment is for. Split into its own feature (rather than putting the
# cpu index on `ideate` itself) so the two environments can differ in the
# one line that separates them.
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.frontier]
platforms = ["linux-64"]

[tool.pixi.feature.frontier.dependencies]
# pip is needed for the `setup-flash-attn` task below to install flash-attn
# from a git URL with --no-build-isolation. The PyTorch wheels we pull from
# the rocm7.1 index don't drag pip in transitively.
pip = "*"
# ninja: aiter (a transitive dep of flash_attn on ROCm) JIT-compiles a small
# C++ extension at first `import flash_attn`. It calls `ninja` from PATH.
ninja = "*"

[tool.pixi.feature.frontier.pypi-dependencies]
# rocm7.1 index ships torch 2.10.0 + torchvision 0.25-0.26 only.
torch       = { version = ">=2.10,<2.11",   index = "https://download.pytorch.org/whl/rocm7.1" }
torchvision = { version = ">=0.25,<0.27",   index = "https://download.pytorch.org/whl/rocm7.1" }
# torch 2.10 declares triton-rocm as a dep; uv won't auto-discover it
# through the per-package `index = ...` above, so list it explicitly.
triton-rocm = { version = "*",              index = "https://download.pytorch.org/whl/rocm7.1" }
# Evaluation suite (scripts/evaluation/): latent-space analyses + probes.
scikit-learn = ">=1.5,<2"
umap-learn   = ">=0.5.7,<0.6"
# Flash-Attention 2 (gfx90a / MI250X) is NOT listed here intentionally:
# the build needs `module load rocm/7.1.1` + `FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE`,
# which pixi/uv can't set. Install via the `setup-flash-attn` task below; we use
# the AMD Triton backend (not Composable Kernel) per the AMD docs at
# rocm.docs.amd.com/.../model-acceleration-libraries.html — Triton skips the
# multi-hour CK template/hipcc compile and builds in ~10-15 min.

[tool.pixi.feature.frontier.tasks]
setup-flash-attn = { cmd = "bash scripts/slurm_frontier/setup_frontier_env.sh", description = "Build & install flash-attn 2 into the frontier pixi env on a Frontier compute node (gfx90a). Auto-salloc's if run from a login node." }
verify-flash-attn = { cmd = "python scripts/slurm_frontier/verify_flash_attn.py", description = "Smoke-test flash_attn on the local MI250X." }

[tool.pixi.environments]
default = ["cuda"]
fdp = ["fdp", "cuda"]
frontier = ["frontier"]
labelmaker = ["labelmaker", "fdp"]
ideate = ["ideate", "cuda"]
ideate-cpu = ["ideate", "ideate-cpu"]
